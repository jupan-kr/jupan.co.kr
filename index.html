 ko:{about:'사이트 소개',privacy:'개인정보처리방침',contact:'문의하기',h1:'온라인 주판 계산기',modeAria:'모드',calc:'계산기',practice:'연습',sum:'합계',soundAria:'알 소리',langAria:'언어',clear:'알 털기',guide:'사용법',

   levels:['1단계 · 한 자리 덧셈','2단계 · 한 자리 덧셈·뺄셈','3단계 · 두 자리 덧셈','4단계 · 두 자리 세 수','5단계 · 세 자리 세 수','6단계 · 곱셈 (두 자리 × 한 자리)'],
   hidden:'주판에 답을 놓아 보세요',ok:'정답이에요!',bad:'아직 아니에요. 다시 해보세요',answerIs:'정답은 {n}',score:'맞힘 {c} / {t}'},
 en:{about:'About',privacy:'Privacy',contact:'Contact',h1:'Online Abacus Calculator',modeAria:'Mode',calc:'Calculator',practice:'Practice',sum:'TOTAL',soundAria:'Bead sound',langAria:'Language',clear:'Clear',guide:'Guide',

 ja:{about:'サイト紹介',privacy:'プライバシー',contact:'お問い合わせ',h1:'オンラインそろばん電卓',modeAria:'モード',calc:'計算',practice:'練習',sum:'合計',soundAria:'珠の音',langAria:'言語',clear:'ご破算',guide:'使い方',
   levelAria:'レベル',peek:'合計を表示',peekHide:'合計を隠す',reveal:'答えを見る',next:'次の問題',check:'答え合わせ',loading:'そろばんを読み込み中…',
   canvasAria:'17桁のそろばん。珠をタップして数を置きます。',

   levels:['1級 · 1桁のたし算','2級 · 1桁のたし算・ひき算','3級 · 2桁のたし算','4級 · 2桁の3口','5級 · 3桁の3口','6級 · かけ算 (2桁×1桁)'],

   levelAria:'难度',peek:'显示合计',peekHide:'隐藏合计',reveal:'查看答案',next:'下一题',check:'判断对错',loading:'正在加载算盘…',
   canvasAria:'17档算盘。点击珠子来拨数。',
   snd:{wood:'木头',plastic:'塑料',bigwood:'老式算盘',glass:'玻璃珠',metal:'金属',cute:'啵啵',off:'静音'},
   levels:['第1级 · 一位数加法','第2级 · 一位数加减','第3级 · 两位数加法','第4级 · 两位数三个数','第5级 · 三位数三个数','第6级 · 乘法（两位数×一位数）'],
   hidden:'请在算盘上拨出答案',ok:'答对了！',bad:'不对，再试一次',answerIs:'答案是 {n}',score:'答对 {c} / {t}'}
};
// 일본어 레벨은 실제 검정 급수와 다르므로 '단계' 의미로 표기
STR.ja.levels=['ステップ1 · 1桁のたし算','ステップ2 · 1桁のたし算・ひき算','ステップ3 · 2桁のたし算','ステップ4 · 2桁の3口','ステップ5 · 3桁の3口','ステップ6 · かけ算 (2桁×1桁)'];
const LOCALE={ko:'ko-KR',en:'en-US',ja:'ja-JP',zh:'zh-CN'};
const SOUNDS=['wood','plastic','bigwood','glass','metal','cute','off'];
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};

const qsLang=new URLSearchParams(location.search).get('lang');
let lang=(qsLang&&STR[qsLang])?qsLang:(STR[store.get('jupan.lang')]?store.get('jupan.lang'):'ko');
let sound=SOUNDS.includes(store.get('jupan.sound'))?store.get('jupan.sound'):'wood';
const T=k=>STR[lang][k];
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);

/* ================= 주판 상태 ================= */
const RODS=17;
const heaven=new Array(RODS).fill(false), earth=new Array(RODS).fill(0);
const hPos=new Array(RODS).fill(0), hAnim=new Array(RODS).fill(null);
const ePos=Array.from({length:RODS},()=>[0,0,0,0]), eAnim=Array.from({length:RODS},()=>[null,null,null,null]);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR=reduce?0:75;

const $=id=>document.getElementById(id);
const app=$('app'), stage=$('stage'), cv=$('cv');
const valueEl=$('value'), wordsEl=$('words');
const coarse=matchMedia('(pointer: coarse)').matches;
let rotated=false;

const adbar=$('adbar');
if(new URLSearchParams(location.search).has('adtest')){ $('adslot').innerHTML='<div class="adtest">광고 자리</div>'; adbar.hidden=false; }
function fitApp(){
  const W=innerWidth;
  rotated = coarse && innerHeight>W;
  // 넓은 PC 화면은 728×90, 그 밖은 320×50
  adbar.classList.toggle('wide', !rotated && W>=768 && innerHeight>=560);
  const H=innerHeight-(adbar.hidden?0:adbar.offsetHeight);
  if(rotated){ app.style.width=H+'px'; app.style.height=W+'px'; app.style.transform=`translateX(${W}px) rotate(90deg)`; }
  else{ app.style.width=W+'px'; app.style.height=H+'px'; app.style.transform=''; }
}
function toApp(cx,cy){ return rotated ? {x:cy, y:innerWidth-cx} : {x:cx, y:cy}; }

/* ================= 3D 장면 ================= */
const P=1, R=P*0.47, BH=0.64, BAR=0.3, F=0.42;
const innerW=RODS*P;
const yTop=BAR/2+BH*1.9, yBot=-BAR/2-BH*5.0;
const totalW=innerW+F*2, totalH=(yTop-yBot)+F*2, cy=(yTop+yBot)/2;

const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(26,1,0.1,200);

scene.add(new THREE.HemisphereLight(0xfff6ea,0x4a4038,0.75));
const key=new THREE.DirectionalLight(0xffffff,1.15);
key.position.set(-6,9,14); key.castShadow=true;
key.shadow.mapSize.set(2048,1024);
const sc=key.shadow.camera; sc.left=-totalW/2-1; sc.right=totalW/2+1; sc.top=yTop+2; sc.bottom=yBot-2; sc.near=1; sc.far=40;
key.shadow.bias=-0.0006; key.shadow.radius=4;
scene.add(key);
const fill=new THREE.DirectionalLight(0xffe8d0,0.35); fill.position.set(8,-4,10); scene.add(fill);

const matFrame=new THREE.MeshStandardMaterial({color:0x17171a,roughness:0.62,metalness:0.05});
const matBack=new THREE.MeshStandardMaterial({color:0xf1efea,roughness:0.95});
const matRod=new THREE.MeshStandardMaterial({color:0xe6cc9c,roughness:0.55});
const matSilver=new THREE.MeshStandardMaterial({color:0xe4e7ec,roughness:0.28,metalness:0.35});
const matDot=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.5});
const matBead=new THREE.MeshPhysicalMaterial({color:0xc75a1a,roughness:0.42,clearcoat:0.35,clearcoatRoughness:0.35});

const zBack=-R-0.12, depth=R*2+0.34;
const back=new THREE.Mesh(new THREE.PlaneGeometry(totalW,totalH),matBack);
back.position.set(0,cy,zBack); back.receiveShadow=true; scene.add(back);
function box(w,h,d,x,y,z,m){const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); g.position.set(x,y,z); g.castShadow=true; g.receiveShadow=true; scene.add(g); return g;}
const zf=zBack+depth/2;

/* ================= 움직임 ================= */
const easeIn=p=>p*p*(1.6-0.6*p); // 0에서 출발해 정확히 1에서 멈춤
let raf=0;
function tick(now){
  let moving=false;
  for(let r=0;r<RODS;r++){
    const a=hAnim[r];
    if(a){const p=DUR?Math.min(1,(now-a.t0)/DUR):1; hPos[r]=p>=1?a.to:a.from+(a.to-a.from)*easeIn(p); if(p>=1)hAnim[r]=null; else moving=true;}
    for(let k=0;k<4;k++){const b=eAnim[r][k];
      if(b){const p=DUR?Math.min(1,(now-b.t0)/DUR):1; ePos[r][k]=p>=1?b.to:b.from+(b.to-b.from)*easeIn(p); if(p>=1)eAnim[r][k]=null; else moving=true;}}
  }
  render();
  raf=moving?requestAnimationFrame(tick):0;
}
function animate(){ if(!raf) raf=requestAnimationFrame(tick); }
function syncTargets(r){
  const now=performance.now();
  const ht=heaven[r]?1:0; if(hPos[r]!==ht) hAnim[r]={from:hPos[r],to:ht,t0:now};
  for(let k=0;k<4;k++){const t=k<earth[r]?1:0; if(ePos[r][k]!==t) eAnim[r][k]={from:ePos[r][k],to:t,t0:now};}
}

/* ================= 소리 =================
   모두 실제 녹음 없이 합성한 소리
   wood 나무 · plastic 플라스틱 · bigwood 옛날 큰 나무 주판 · glass 유리구슬 · metal 금속 · cute 뽁 효과음 */
let actx=null, master=null;
const bufs={};
function audio(){
  if(!actx){
    try{actx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}catch(e){return null;}
    master=actx.createDynamicsCompressor(); master.threshold.value=-12; master.ratio.value=4;
    const out=actx.createGain(); out.gain.value=0.9; master.connect(out).connect(actx.destination);
  }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
function profileFor(p,kind){
  const bar=kind==='bar';
  switch(p){
    case 'wood':{const s=bar?0.82:1; return {len:.14,
      modes:[[rnd(780,920)*s,1,rnd(.022,.032)],[rnd(1450,1700)*s,.55,rnd(.012,.018)],[rnd(2450,2850)*s,.3,rnd(.006,.009)],[rnd(3900,4400)*s,.12,rnd(.003,.005)]],
      noise:.45,noiseTau:.0018,thump:bar?1.4:.9,thumpTau:.012};}
    case 'plastic':{const s=bar?0.75:1; return {len:.14,
      modes:[[rnd(2300,2700)*s,.9,rnd(.006,.009)],[rnd(3900,4500)*s,.6,rnd(.004,.006)],[rnd(5800,6600)*s,.35,rnd(.003,.004)],[rnd(1400,1700)*s,.35,rnd(.010,.014)]],
      noise:.9,noiseTau:.0012,thump:bar?1.6:.8,thumpTau:.004};}
    case 'bigwood':{const s=bar?0.8:1; return {len:.22,
      modes:[[rnd(420,500)*s,1,rnd(.04,.055)],[rnd(900,1050)*s,.6,rnd(.022,.03)],[rnd(1600,1850)*s,.3,rnd(.01,.014)],[rnd(2600,3000)*s,.12,rnd(.005,.007)]],
      noise:.35,noiseTau:.0025,thump:bar?2.2:1.6,thumpTau:.022};}
    case 'glass':{const f=rnd(2700,3300)*(bar?0.85:1); return {len:.45,
      modes:[[f,1,rnd(.09,.12)],[f*2.32,.45,rnd(.05,.07)],[f*4.11,.2,rnd(.025,.035)],[f*1.003,.5,rnd(.09,.12)]],
      noise:.35,noiseTau:.0008,thump:.25,thumpTau:.003};}
    case 'metal':{const f=rnd(1700,2100)*(bar?0.85:1); return {len:.5,
      modes:[[f,1,rnd(.11,.14)],[f*1.006,.6,rnd(.11,.14)],[f*1.48,.7,rnd(.08,.1)],[f*2.21,.5,rnd(.06,.08)],[f*3.03,.35,rnd(.04,.05)],[f*4.17,.2,rnd(.02,.03)]],
      noise:.5,noiseTau:.001,thump:.4,thumpTau:.004};}
    case 'cute':{const f=rnd(480,560)*(bar?0.8:1); return {len:.13,
      modes:[[f,1,.035]],sweep:[f,f*rnd(2.3,2.7),.025],noise:.05,noiseTau:.0006,thump:0,thumpTau:.001};}
  }
}
function makeClick(a,p,kind){
  const c=profileFor(p,kind);
  const sr=a.sampleRate, len=Math.floor(sr*c.len), buf=a.createBuffer(1,len,sr), d=buf.getChannelData(0);
  const ph=c.modes.map(()=>Math.random()*Math.PI*2);
  let prev=0, lp=0, swPhase=0;
  for(let i=0;i<len;i++){
    const t=i/sr; let s=0;
    if(c.sweep){
      const [f0,f1,tau]=c.sweep; const f=f1-(f1-f0)*Math.exp(-t/tau);
      swPhase+=2*Math.PI*f/sr; s+=Math.sin(swPhase)*Math.exp(-t/c.modes[0][2]);
    }else{
      for(let m=0;m<c.modes.length;m++){const [f,amp,tau]=c.modes[m]; s+=amp*Math.sin(2*Math.PI*f*t+ph[m])*Math.exp(-t/tau);}
    }
    const n=Math.random()*2-1, hp=n-prev; prev=n;
    s+=hp*c.noise*Math.exp(-t/c.noiseTau);
    if(c.thump){ lp+=((Math.random()*2-1)*Math.exp(-t/c.thumpTau)-lp)*0.06; s+=lp*c.thump*3; }
    const att=Math.min(1,t/(c.sweep?0.002:0.0003));
    const tail=Math.min(1,(len-i)/(sr*0.01));
    d[i]=s*att*tail;
  }
  let pk=0; for(let i=0;i<len;i++) pk=Math.max(pk,Math.abs(d[i]));
  for(let i=0;i<len;i++) d[i]/=pk||1;
  return buf;
}
function getBufs(p,kind){
  const key=p+kind;
  if(!bufs[key]){ bufs[key]=[]; for(let i=0;i<6;i++) bufs[key].push(makeClick(actx,p,kind)); }
  return bufs[key];
}
const LOUD={wood:.8,plastic:.8,bigwood:.85,glass:.55,metal:.5,cute:.7};
function clack(delay=0,strength=1,kind='bead'){
  if(sound==='off') return; const a=audio(); if(!a) return;
  const set=getBufs(sound,kind);
  const src=a.createBufferSource(); src.buffer=set[(Math.random()*set.length)|0];
  src.playbackRate.value=0.95+Math.random()*0.1;
  const g=a.createGain(); g.gain.value=LOUD[sound]*strength;
  src.connect(g).connect(master); src.start(a.currentTime+Math.max(0,delay));
}
function impactSound(moved,toBar){
  const d=DUR/1000;
  clack(d,1,toBar?'bar':'bead');
  for(let i=1;i<Math.min(moved,4);i++) clack(d+i*0.007+Math.random()*0.004,0.45,'bead');
}
function tone(freqs,step,dur,gain,type='sine'){
  if(sound==='off') return; const a=audio(); if(!a) return;
  freqs.forEach((f,i)=>{
    const t0=a.currentTime+i*step, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(gain,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.02);
  });
}
const chimeOk=()=>tone([1046.5,1318.5,1568],0.09,0.35,0.18);
const chimeBad=()=>tone([330,262],0.12,0.25,0.12,'triangle');

/* ================= 숫자 읽기 (언어별) ================= */
function readKo(n){
  if(n===0n) return '영';
  const D=['','일','이','삼','사','오','육','칠','팔','구'], U=['','만','억','조','경'], S=['','십','백','천'];
  let s='', i=0;
  while(n>0n){
    let ch=Number(n%10000n); n/=10000n;
    if(ch){ const only1=ch===1&&i===1; let c=''; for(let p=0;p<4;p++){const dg=ch%10; ch=Math.floor(ch/10); if(dg) c=(dg===1&&p>0?'':D[dg])+S[p]+c;} s=(only1?'':c)+U[i]+' '+s; }
    i++;
  }
  return s.trim();
}
function readJa(n){
  if(n===0n) return '零';
  const D=['','一','二','三','四','五','六','七','八','九'], U=['','万','億','兆','京'], S=['','十','百','千'];
  let s='', i=0;
  while(n>0n){
    let ch=Number(n%10000n); n/=10000n;
    if(ch){ let c=''; for(let p=0;p<4;p++){const dg=ch%10; ch=Math.floor(ch/10); if(dg) c=(dg===1&&p>0&&!(p===3&&i>0)?'':D[dg])+S[p]+c;} s=c+U[i]+s; }
    i++;
  }
  return s;
}
function readZh(n){
  if(n===0n) return '零';
  const D=['零','一','二','三','四','五','六','七','八','九'], U=['','万','亿','万亿','亿亿'], S=['','十','百','千'];
  const chunks=[]; while(n>0n){chunks.push(Number(n%10000n)); n/=10000n;}
  let out='', needZero=false;
  for(let i=chunks.length-1;i>=0;i--){
    const ch=chunks[i];
    if(ch===0){ needZero=out!==''; continue; }
    if(out!==''&&(ch<1000||needZero)) out+='零';
    needZero=false;
    const ds=[Math.floor(ch/1000)%10,Math.floor(ch/100)%10,Math.floor(ch/10)%10,ch%10];
    let c='', zero=false, started=false;
    for(let j=0;j<4;j++){
      const dg=ds[j], p=3-j;
      if(dg===0){ if(started) zero=true; continue; }
      if(zero){ c+='零'; zero=false; }
      c+=(dg===1&&p===1&&!started&&out==='')?'十':D[dg]+S[p];
      started=true;
    }
    out+=c+U[i];
  }
  return out;
}
function readEn(n){
  if(n===0n) return 'zero';
  const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const U=['','thousand','million','billion','trillion','quadrillion'];
  const three=x=>{let s=[]; const h=Math.floor(x/100), r=x%100;
    if(h) s.push(ones[h]+' hundred');
    if(r){ s.push(r<20?ones[r]:tens[Math.floor(r/10)]+(r%10?'-'+ones[r%10]:'')); }
    return s.join(' ');};
  const parts=[]; let i=0;
  while(n>0n){const c=Number(n%1000n); n/=1000n; if(c) parts.unshift(three(c)+(U[i]?' '+U[i]:'')); i++;}
  return parts.join(' ');
}
const READ={ko:readKo,ja:readJa,zh:readZh,en:readEn};

/* ================= 주판 조작 ================= */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function hitAt(cx,cy){
  const p=toApp(cx,cy);
  const x=p.x-stage.offsetLeft, y=p.y-stage.offsetTop;
  ndc.set(x/stage.clientWidth*2-1, -(y/stage.clientHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  return hit?{...hit.object.userData,y:p.y}:null;
}
function apply(t,dir){
  let moved=0, toBar=false;
  if(t.type==='h'){
    const on = dir==='tap'? !heaven[t.r] : dir==='down';
    if(heaven[t.r]!==on){ heaven[t.r]=on; moved=1; toBar=on; }
  }else{
    const active=t.k<earth[t.r];
    const on = dir==='tap'? !active : dir==='up';
    const count= on? Math.max(earth[t.r],t.k+1) : Math.min(earth[t.r],t.k);
    moved=Math.abs(earth[t.r]-count); toBar=count>earth[t.r]; earth[t.r]=count;
  }
  if(moved){ syncTargets(t.r); impactSound(moved,toBar); update(); animate(); clearFeedback(); }
}
let start=null;
cv.addEventListener('pointerdown',e=>{
  audio();
  const t=hitAt(e.clientX,e.clientY); if(!t) return;
  start={t,y:t.y,done:false}; try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!start||start.done) return;
  const dy=toApp(e.clientX,e.clientY).y-start.y;
  if(Math.abs(dy)>8){ apply(start.t,dy<0?'up':'down'); start.done=true; }
});
cv.addEventListener('pointerup',()=>{ if(start&&!start.done) apply(start.t,'tap'); start=null; });
cv.addEventListener('pointercancel',()=>{start=null;});

function setValue(v,withSound){

    if(heaven[r]!==h||earth[r]!==e){ heaven[r]=h; earth[r]=e; syncTargets(r);
      if(withSound){ clack(DUR/1000+n*0.013+Math.random()*0.01,0.5+Math.random()*0.4,Math.random()<.3?'bar':'bead'); n++; } }
  }

}

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const GEN=[
  ()=>{const a=ri(1,9),b=ri(1,9); return {terms:[a,'+',b],ans:a+b};},
  ()=>{const a=ri(1,9),b=ri(1,9); return Math.random()<.5||a<b?{terms:[a,'+',b],ans:a+b}:{terms:[a,'−',b],ans:a-b};},
  ()=>{const a=ri(10,99),b=ri(10,99); return {terms:[a,'+',b],ans:a+b};},
  ()=>three(10,99),
  ()=>three(100,999),
  ()=>{const a=ri(12,99),b=ri(2,9); return {terms:[a,'×',b],ans:a*b};}
];
function three(lo,hi){
  const a=ri(lo,hi), b=ri(lo,hi); let s1=Math.random()<.6?'+':'−'; let v1=s1==='+'?a+b:a-b;
  if(v1<0){ s1='+'; v1=a+b; }
  const c=ri(lo,hi); let s2=Math.random()<.5?'+':'−'; let v2=s2==='+'?v1+c:v1-c;
  if(v2<0){ s2='+'; v2=v1+c; }
  return {terms:[a,s1,b,s2,c],ans:v2};
}
let level=+(store.get('jupan.level')||0); if(!(level>=0&&level<GEN.length)) level=0;

  document.querySelectorAll('[data-i18n]').forEach(el=>{ const v=T(el.dataset.i18n); if(typeof v==='string') el.textContent=v; });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',T(el.dataset.i18nAria)));
  soundSel.innerHTML=SOUNDS.map(s=>`<option value="${s}">${T('snd')[s]}</option>`).join(''); soundSel.value=sound;
  levelSel.innerHTML=T('levels').map((t,i)=>`<option value="${i}">${t}</option>`).join(''); levelSel.value=level;
  langSel.value=l;
  $('guide').hidden=l!=='ko';
  $('peek').textContent=T(peek?'peekHide':'peek');
  drawProblem(); drawScore(); update();
  if(fbEl.dataset.state==='ok') fbEl.textContent=T('ok');
  else if(fbEl.dataset.state==='bad') fbEl.textContent=T('bad');
  else if(fbEl.dataset.state==='reveal'&&prob) fbEl.textContent=fmt(T('answerIs'),{n:prob.ans.toLocaleString(LOCALE[lang])});
  requestAnimationFrame(resize);
}

// 예시: 첫 화면에 1,234,567을 놓아 둠
[1,2,3,4,5,6,7].forEach((d,i)=>{const r=RODS-7+i; heaven[r]=d>=5; earth[r]=d%5; hPos[r]=heaven[r]?1:0; for(let k=0;k<4;k++)ePos[r][k]=k<earth[r]?1:0;});

addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));
new ResizeObserver(resize).observe(document.body);
$('loading').hidden=true;
setLang(lang);
resize();
})();
</script>
